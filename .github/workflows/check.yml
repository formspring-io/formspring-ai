name: check

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hardcoded tokens
        run: |
          chmod +x scripts/check-no-secrets.sh
          ./scripts/check-no-secrets.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: formspring.io links resolve
        run: ./scripts/check-links.sh

  validate-plugin:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate Claude plugin manifest
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
          else
            echo "Claude Code CLI not on runner; run 'claude plugin validate . --strict' locally before release."
          fi

  prompt-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup prompt files are present
        run: |
          set -euo pipefail
          for f in verify.md inbox.md webhooks.md triage-spam-setup.md integrations.md; do
            test -s "prompts/${f}"
          done
          grep -q 'list_forms' prompts/verify.md
          grep -q 'folder: "spam"' prompts/triage-spam-setup.md
          grep -q 'get_framework_integration_catalog' prompts/integrations.md

  prompt-sync:
    runs-on: ubuntu-latest
    if: ${{ vars.PIXEL_FORMS_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.PIXEL_FORMS_REPO }}
          path: pixel-forms
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Install app dependencies
        working-directory: pixel-forms
        run: composer install --no-interaction --prefer-dist --no-dev
      - name: Compare prompts with SetupPrompts.php
        env:
          PIXEL_FORMS_PATH: ${{ github.workspace }}/pixel-forms
        run: |
          chmod +x scripts/check-setup-prompts-sync.sh
          ./scripts/check-setup-prompts-sync.sh
